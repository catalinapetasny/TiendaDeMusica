<div class="container contacto-container">
    <h1 class="titulo">
        Contactanos
    </h1>

    <p class="subtitulo">
        ¿Tenés alguna consulta sobre un pedido o buscás un álbum específico?
        Escribinos y te ayudamos 🖤
    </p>

    <div class="row">
        <!-- FORMULARIO -->
        <div class="col-md-7">
            <div class="card formulario">
                <div class="card-body">
                    <h4>
                        Enviar mensaje
                    </h4>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" placeholder="Ingresá tu nombre">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" placeholder="ejemplo@gmail.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Asunto</label>
                        <input type="text" class="form-control" placeholder="¿En qué podemos ayudarte?">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea rows="5" class="form-control" placeholder="Escribí tu mensaje"></textarea>
                    </div>

                    <button class="btn btn-dark">
                        Enviar mensaje
                    </button>
                </div>
            </div>
        </div>


        <!-- INFO -->

        <div class="col-md-5">
            <div class="card info-contacto">
                <div class="card-body">
                    <h4>Información</h4>
                    <p>📍 Cipolletti, Río Negro</p>
                    <p>📞 +54 299 123 4567</p>
                    <p>✉️ contacto@blackcatmusic.com</p>
                    <p>🕒 Lunes a Viernes
                        9:00 — 18:00
                    </p>
                    <hr>
                    <h5>Seguinos</h5>
                    <div class="redes">
                        <i class="bi bi-instagram"></i>
                       <i class="bi bi-facebook"></i>
                        <i class="bi bi-tiktok"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
