<main class="container products-page">
  <header class="page-heading">
    <span class="eyebrow">EXPLORÁ LA COLECCIÓN</span>
    <h1>🦇 <b>CD's y Vinilos</b> 🦇</h1>
    <p>Encontrá ese disco que no puede faltar en tu colección.</p>
  </header>

  <div class="buscador">
    <i class="bi bi-search"></i>
    <input [(ngModel)]="buscar" placeholder="Buscar producto..." aria-label="Buscar producto">
    <button (click)="cargar()">Buscar</button>
  </div>

  <div class="row products-grid">
    @for (p of productos; track p.id) {
    <div class="card col-12 col-sm-6 col-lg-4 col-xl-3 p-0 product-card">
      <div class="product-card-inner">
        <div class="product-image-wrap">
          <img [src]="'http://localhost/api_proyecto/public/uploads/' + p.imagen" [alt]="p.nombre" class="card-img-top">
        </div>
        <div class="card-body">
          <h2 class="card-title">{{ p.nombre }}</h2>
          <p class="card-text product-description">{{ p.descripcion }}</p>
          <p class="card-text product-price">${{ p.precio }}</p>
          <button (click)="agregar(p.id)" class="btn btn-dark">Agregar al carrito</button>
        </div>
      </div>
    </div>
    } @empty {
    <div class="col-12">
      <div class="products-empty"><i class="bi bi-disc"></i>
        <p>No se encontraron productos :c</p>
      </div>
    </div>
    }
  </div>
</main>
