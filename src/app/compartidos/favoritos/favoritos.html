<main class="favorites-page">
  <header class="page-heading">
    <span class="eyebrow">TU COLECCIÓN PERSONAL</span>
    <h1 class="title-favorite">Productos favoritos :3</h1>
    <p>Los discos que querés tener siempre a mano.</p>
  </header>

  <div class="container favorites-container">
    <div class="favorites-list">
      @for (f of favoritos; track f.id) {
        <article class="fav favorite-card">
          <div class="favorite-icon"><i class="bi bi-heart-fill"></i></div>
          <div class="favorite-info">
            <h2>{{ f.nombre }}</h2>
            <p>${{ f.precio }}</p>
          </div>
          <button class="btn btn-sm btn-outline-danger" (click)="quitar(f.id_producto)">
            <i class="bi bi-trash3"></i> Eliminar
          </button>
        </article>
      } @empty {
        <div class="favorites-empty">
          <i class="bi bi-heart"></i>
          <h2>Tu lista está esperando música</h2>
          <p>No hay productos agregados a Favoritos :c</p>
        </div>
      }
    </div>
  </div>
</main>
