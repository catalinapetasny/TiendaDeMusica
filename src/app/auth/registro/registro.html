<div class="contenedor-login">
  
  <h1 class="titulo">Crear cuenta</h1>

  <form>
    <div class="grupo-input">
      <label for="email" class="etiqueta">Email</label>
      <input type="email" id="email" class="campo-texto" required placeholder="Ingrese su email">
    </div>

    <div class="grupo-input">
      <label for="contrasena" class="etiqueta">Crea una contraseña</label>
      <input type="password" id="contrasena" class="campo-texto" required placeholder="••••••••">
    </div>
    
    <div class="grupo-input">
      <label for="repetir-contrasena" class="etiqueta">Repita la contraseña</label>
      <input type="password" id="repetir-contrasena" class="campo-texto" required placeholder="••••••••">
    </div>

    <button type="submit" class="boton-ingresar">
      REGISTRARSE
    </button>
  </form>

  <p class="texto-registro">
    <a routerLink="/inicio-sesion" class="enlace">¿Ya tenés cuenta? Inicia sesión acá.</a>
  </p>

</div>
