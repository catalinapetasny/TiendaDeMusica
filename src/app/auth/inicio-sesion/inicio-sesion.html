<main class="auth-container">
  <section class="contenedor-login">
    <div class="auth-symbol">🦇</div>
    <span class="auth-kicker">BIENVENIDO/A DE NUEVO</span>
    <h1>Iniciar Sesión</h1>
    <p class="auth-intro">Ingresá a tu cuenta y seguí descubriendo música.</p>

    <form>
      <div class="grupo-input">
        <label for="email" class="etiqueta">Email</label>
        <input [(ngModel)]="email" name="email" placeholder="Email" type="email" class="campo-texto" required id="email">
      </div>
      <div class="grupo-input">
        <label for="contrasena" class="etiqueta">Contraseña</label>
        <input [(ngModel)]="contrasena" name="contrasena" placeholder="Contraseña" type="password" class="campo-texto" required id="contrasena">
      </div>
      <button (click)="ingresar()" class="boton-ingresar">Ingresar</button>
    </form>

    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <p class="texto-registro">
      <a routerLink="/registro" class="enlace">¿No tenés una cuenta? Registrate acá.</a>
    </p>
  </section>
</main>
